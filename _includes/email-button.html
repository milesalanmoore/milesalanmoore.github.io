<script>
  document.addEventListener("DOMContentLoaded", function () {
    const u = "miles";
    const d = "milesalanmoore.com";

    const link = document.createElement("a");
    link.href = `mailto:${u}@${d}`;
    link.title = "Email me";
    link.className = "nav-email-link";
    link.innerHTML = `<i class="bi bi-envelope"></i><span>Contact</span>`;

    const navbarRight = document.querySelector(".navbar-nav.ms-auto, #navbarCollapse .navbar-nav");
    if (navbarRight) {
      const li = document.createElement("li");
      li.className = "nav-item";
      li.appendChild(link);
      navbarRight.appendChild(li);
    }
  });
</script>
